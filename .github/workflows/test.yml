# The tests run only when started by hand (Actions, test, Run workflow). The fast
# suite always runs, and the long suite (against RustFS, with the fault tests and
# e2e) only if long is ticked. Both are the Makefile's test targets, which are
# the way to run them locally too.
name: test

on:
  workflow_dispatch:
    inputs:
      long:
        description: Also run the long suite
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    # A guess, to adjust from real runs.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum
      - name: Build
        run: |
          go build ./...
          CGO_ENABLED=0 go build ./...
          (cd e2e && go build ./...)
      - name: Vet
        run: |
          go vet ./...
          go vet -tags fault ./...
          (cd e2e && go vet -tags fault ./...)
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt would change:"
            echo "$out"
            exit 1
          fi
      - name: Lint
        run: make lint
      - name: Fast suite
        run: make test
        env:
          TESTWATCH_OUT: ${{ runner.temp }}/testwatch/fast
      - name: Fast suite with -race
        run: make test ARGS=-race
        env:
          TESTWATCH_OUT: ${{ runner.temp }}/testwatch/fast-race
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fast-test-output
          path: ${{ runner.temp }}/testwatch
          if-no-files-found: ignore

  long:
    if: inputs.long
    runs-on: ubuntu-latest
    # A guess, to adjust from real runs.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum
      - name: Start RustFS
        run: |
          docker compose -f docker/compose.s3.yaml up -d
          for i in $(seq 60); do
            if curl -s -o /dev/null --max-time 2 http://127.0.0.1:19000; then
              exit 0
            fi
            sleep 2
          done
          echo "RustFS did not answer in 2 minutes"
          docker compose -f docker/compose.s3.yaml logs
          exit 1
      - name: Long suite
        run: make test-long
        env:
          TESTWATCH_OUT: ${{ runner.temp }}/testwatch
      - name: RustFS logs
        if: failure()
        run: mkdir -p "$RUNNER_TEMP/testwatch" && docker compose -f docker/compose.s3.yaml logs > "$RUNNER_TEMP/testwatch/rustfs.log" 2>&1 || true
      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: long-test-output
          path: ${{ runner.temp }}/testwatch
          if-no-files-found: ignore
